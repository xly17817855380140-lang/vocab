<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121213" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="生词本">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>生词本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/*
VOICE: quick and calm, a pocket tool opened for ten seconds at a time; plain Apple-like controls; reads equally well in Chinese, English and Thai.
IDEA: the highlighter on a page: every new word is one you marked in yellow.
PICTURE: the yellow capture strip with live results under it; on Study, the day's two big numbers and the flash card with its marked headword.
COLOUR and TYPE: white paper, black ink, highlighter yellow; pink/orange/green/blue highlighters grade recall. Charis SIL for headwords and IPA, the system font for Chinese and Thai.
LAYOUT: one phone column up to 680px, sticky header with three tabs, sheets rising from the bottom.
*/
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#121213);--raise:light-dark(#ffffff,#1c1c1f);--sunk:light-dark(#f2f2f0,#212124);
--ink:light-dark(#151515,#f1f1f1);--ink2:light-dark(#5d5d5d,#a6a6a6);--line:light-dark(#e5e5e2,#333337);
--hl:#ffe54a;--mark:light-dark(#ffe54a,rgba(255,222,50,.38));
--band:light-dark(#ffe54a,#29250f);--band-ink:light-dark(#151515,#f4e68c);--band-in:light-dark(#ffffff,#151515);--band-bd:light-dark(#151515,#6b6122);
--btn:light-dark(#151515,#ffe54a);--btn-ink:light-dark(#ffffff,#151515);
--pink:#ff99b9;--orange:#ffbb6e;--green:#9ae392;--blue:#92d1ff;--on:#151515;
--bad:light-dark(#c2214e,#ff8fad);--good:light-dark(#1d7a33,#93e3a0);
--serif:"Charis SIL","Gentium Book Plus",Georgia,"Times New Roman",serif;
--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Thonburi","Sukhumvit Set","Noto Sans SC","Noto Sans Thai","Microsoft YaHei",system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html.lock,html.lock body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);overflow-x:clip;-webkit-tap-highlight-color:transparent}
:lang(th) body,body:lang(th){line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
h2{font:700 20px/1.3 var(--sans);margin:0 0 8px;text-wrap:balance}
h3{font:600 15px/1.4 var(--sans);margin:22px 0 8px;color:var(--ink2)}
.wrap{max-width:680px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left))}
.mk{background:linear-gradient(transparent 50%,var(--mark) 50%,var(--mark) 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .12em;margin:0 -.12em}
.fine{font-size:14px;color:var(--ink2);margin:6px 0}
.pend{color:var(--ink2)}.bad{color:var(--bad)}
/* header */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(16px);backdrop-filter:saturate(1.8) blur(16px);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:8px}
.logo{margin:0;font:800 23px/1.2 var(--sans);letter-spacing:.02em}
.hd-r{display:flex;align-items:center;gap:2px}
.lng{border:0;background:var(--sunk);border-radius:999px;min-height:34px;padding:0 12px;font-size:14px;font-weight:650;color:var(--ink)}
.icon{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;border-radius:12px;margin-right:-10px;color:var(--ink);flex:none}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;margin:6px 0 10px;background:var(--sunk);border-radius:14px}
.tabs button{min-height:42px;border:0;border-radius:10px;background:transparent;font-weight:600;font-size:16px;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--hl);color:var(--on);font:700 13px/22px var(--sans);font-variant-numeric:tabular-nums}
main{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
/* capture */
.cap{background:var(--band);color:var(--band-ink);padding:18px 0 16px}
.cap-l{display:block;font:800 22px/1.3 var(--sans);margin:0 0 12px}
.cap-row{display:flex;gap:8px}
.cap input{width:100%;height:54px;border:2px solid var(--band-bd);border-radius:14px;background:var(--band-in);color:var(--ink);padding:0 14px;font-size:19px}
.cap input::placeholder{color:var(--ink2)}
.cap input:focus{outline:none;box-shadow:0 0 0 4px light-dark(rgba(21,21,21,.16),rgba(255,229,74,.3))}
.cap .note{height:46px;font-size:16px;margin-top:8px;border-width:1.5px}
.cap .add{min-height:54px;padding:0 20px;font-size:18px;border-radius:14px;flex:none}
.hint{margin:9px 2px 0;font-size:14px;opacity:.82}
.ac{list-style:none;margin:8px 0 0;padding:4px;background:var(--band-in);color:var(--ink);border:2px solid var(--band-bd);border-radius:14px}
.ac li{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
.ac li:last-child{border-bottom:0}
.ac-m{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;background:none;padding:8px 10px;text-align:left;min-height:52px;border-radius:10px;color:var(--ink)}
.ac-add{flex:none;min-height:38px;padding:0 12px;border:0;border-radius:10px;background:var(--btn);color:var(--btn-ink);font-weight:650;font-size:15px;margin-right:4px;white-space:nowrap}
/* buttons */
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:0;font-weight:650;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.25}
.btn.big{width:100%;min-height:54px;font-size:17px;border-radius:15px}
.btn.ink{background:var(--btn);color:var(--btn-ink)}
.btn.hl{background:var(--hl);color:var(--on)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}
.btn.danger{background:transparent;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;box-shadow:none}
.btn.sm{min-height:38px;padding:0 14px;font-size:15px}
.link{border:0;background:none;padding:0;min-height:44px;color:var(--ink2);font-weight:600;font-size:15px;text-decoration:underline;text-underline-offset:3px;text-align:left}
.chip{border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--raise);border-radius:999px;min-height:40px;padding:0 14px;font-size:15px;font-weight:550;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);box-shadow:none}
/* home */
.notice{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:10px 8px 10px 14px;border-radius:14px;background:var(--sunk);font-size:15px}
.pick{margin-top:16px;border-radius:18px;box-shadow:inset 0 0 0 2px var(--ink);padding:6px 14px 10px}
.pick-h{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.pick-h b{font-size:17px}
.due{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:4px 16px;padding:22px 0 18px;border-bottom:1px solid var(--line)}
.num{font:800 clamp(58px,17vw,78px)/.95 var(--sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.num.zero{color:var(--ink2)}
.due p{margin:8px 0 0;font-size:16px;color:var(--ink2)}
.due .btn{min-height:52px;padding:0 22px;font-size:17px;border-radius:15px}
.facts{grid-column:1/-1;list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--ink2)}
.facts b{color:var(--ink);font-size:17px;margin-right:4px;font-variant-numeric:tabular-nums}
.sec{padding:22px 0 6px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec-h h2{margin:0}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row-m{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;background:none;padding:11px 0;text-align:left;min-height:62px;color:var(--ink)}
.r1{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px}
.hw{font:700 20px/1.25 var(--serif)}
.ipa{font:400 15px/1.3 var(--serif);color:var(--ink2)}
.gl{font-size:14px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.spk{width:44px;height:44px;border:0;border-radius:50%;background:var(--sunk);display:grid;place-items:center;flex:none;color:var(--ink)}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
.dots.k i{background:var(--green)}
.mbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunk);margin:10px 0 12px}
.mbar i{display:block;height:100%}
.m0{background:light-dark(#d6d6d2,#4b4b50)}.m1{background:var(--orange)}.m2{background:var(--hl)}.m3{background:var(--green)}.m4{background:var(--blue)}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--ink2)}
.legend li{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.fc7{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.fc7 li{display:grid;grid-template-columns:4.6em minmax(0,1fr) 2.4em;align-items:center;gap:10px;font-size:14px}
.fc7 .tr{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.fc7 .tr i{display:block;height:100%;background:var(--ink);border-radius:5px}
.fc7 b{text-align:right;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;max-width:420px}
.cal span{font-size:13px;color:var(--ink2);text-align:center}
.cal i{aspect-ratio:1;border-radius:7px;background:var(--sunk)}
.cal i.c1{background:color-mix(in srgb,var(--hl) 35%,var(--sunk))}.cal i.c2{background:color-mix(in srgb,var(--hl) 65%,var(--sunk))}.cal i.c3{background:var(--hl)}.cal i.c4{background:var(--ink)}
.cal i.today{box-shadow:inset 0 0 0 2px var(--ink)}.cal i.c4.today{box-shadow:inset 0 0 0 2px var(--hl)}
.cal i.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.how{margin:14px 0 0;padding-left:1.3em;display:grid;gap:10px;font-size:15px}
/* word parts */
.prs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}
.prs.left{justify-content:flex-start}
.pr{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px 0 14px;border-radius:999px;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--raise);color:var(--ink)}
.pr-l{font-size:13px;font-weight:700;color:var(--ink2)}
.pr .ipa{font-size:18px;color:var(--ink)}
.trs{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px;font-size:17px;line-height:1.5;text-align:left}
.trs i,.pos{font:italic 15px var(--serif);color:var(--ink2);margin-right:6px}
.trs .ml{margin-bottom:-2px}
.mlt{display:inline-block;font-size:13px;font-weight:700;color:var(--ink2);border-radius:6px;background:var(--sunk);padding:0 7px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.tag.hot{background:color-mix(in srgb,var(--hl) 55%,transparent);color:var(--ink)}
.tip{margin:12px 0 0;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--hl) 30%,transparent);font-size:15px;text-align:left}
.forms{margin:0;font-size:15px;line-height:1.8}
.forms span{white-space:nowrap;margin-right:14px}
.forms b{font:600 16px var(--serif)}
.defs{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.defs li{font:16px/1.5 var(--serif)}
.defs .ex{display:flex;gap:8px;align-items:flex-start;border:0;background:none;padding:4px 0 0;text-align:left;color:var(--ink2);font:italic 15.5px/1.45 var(--serif)}
.defs .ex svg{flex:none;margin-top:1px}
.sim{white-space:pre-wrap;font-size:15px;line-height:1.65;background:var(--sunk);border-radius:14px;padding:12px 14px;margin:0}
/* study */
.plan{padding:22px 0 8px;display:grid;gap:14px}
.plan h2{margin:0}
.plan-n{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan-n div{background:var(--sunk);border-radius:18px;padding:14px 16px 12px;display:grid;gap:4px}
.plan-n .num{font-size:clamp(48px,14vw,64px)}
.plan-n span:last-child{font-size:15px;color:var(--ink2);font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--sunk);border-radius:12px;padding:3px;gap:3px;width:100%}
.seg.two{grid-auto-flow:row;grid-template-columns:1fr 1fr}
.seg button{min-height:42px;border:0;border-radius:9px;background:transparent;font-size:15px;font-weight:600;color:var(--ink2);padding:2px 6px;line-height:1.25}
.seg button[aria-checked=true]{background:var(--raise);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14),inset 0 0 0 1px var(--line)}
.book{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sunk);border-radius:16px;padding:12px 12px 12px 16px}
.book b{display:block;font-size:17px}
.bk-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.bk-list button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px;border:0;border-radius:14px;padding:8px 16px;background:var(--sunk);color:var(--ink);text-align:left;font-size:16px;font-weight:600}
.bk-list button[aria-pressed=true]{background:var(--hl);color:var(--on)}
.bk-list small{font-weight:500;color:inherit;opacity:.7;white-space:nowrap}
/* review */
.rv-top{display:flex;align-items:center;gap:12px;padding-top:14px}
.prog{flex:1;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width .3s}
.left-n{font-size:14px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.fc{margin-top:14px;background:var(--raise);border:1px solid var(--line);border-radius:24px;box-shadow:0 16px 36px -20px rgba(0,0,0,.4);padding:28px 20px 24px;min-height:min(44vh,380px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.fc[data-act]{cursor:pointer}
.fc-word{font:700 clamp(34px,11vw,54px)/1.12 var(--serif);overflow-wrap:anywhere;text-wrap:balance}
.fc-word.sm{font-size:clamp(28px,8vw,40px)}
.fc-hint{margin:10px 0 0;color:var(--ink2);font-size:15px}
.fc-back{width:100%;display:flex;flex-direction:column;align-items:center;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.fc.open .fc-back{animation:rise .28s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fc .trs{width:100%}
.opts{display:grid;gap:8px;width:100%;margin-top:18px}
.opt{min-height:52px;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--raise);border-radius:14px;padding:10px 14px;text-align:left;font-size:16px;line-height:1.4;color:var(--ink)}
.opt.right{background:color-mix(in srgb,var(--green) 60%,var(--raise));box-shadow:none;color:var(--on)}
.opt.wrong{background:color-mix(in srgb,var(--pink) 60%,var(--raise));box-shadow:none;color:var(--on)}
.ex1{border:0;background:var(--sunk);border-radius:14px;padding:10px 14px;text-align:left;width:100%;margin-top:12px;color:var(--ink);font:16px/1.45 var(--serif)}
.fc-back .tip{width:100%}
.mynote{margin:10px 0 0;font-size:14px;color:var(--ink2);text-align:left;width:100%}
.spell{display:flex;gap:8px;width:100%;max-width:380px;margin-top:16px;align-items:center}
.spell input{flex:1;height:50px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:0 12px;font:20px var(--serif);text-align:center}
.spell input:focus{outline:none;border-color:var(--ink)}
.sp-res{margin:8px 0 0;min-height:1.5em;font-size:15px}
.sp-res .ok{color:var(--good);font-weight:600}
.hintw{font:18px var(--serif);letter-spacing:.08em;color:var(--ink2)}
.bigspk{width:104px;height:104px;border-radius:50%;border:0;background:var(--hl);color:var(--on);display:grid;place-items:center}
.bigspk svg{width:46px;height:46px}
.rv-act{position:sticky;bottom:0;padding:14px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--bg) 14px)}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.g{min-height:66px;border:0;border-radius:16px;color:var(--on);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px}
.g b{font-size:16px;line-height:1.2}.g small{font-size:13px;opacity:.78;white-space:nowrap}
.g0{background:var(--pink)}.g1{background:var(--orange)}.g2{background:var(--green)}.g3{background:var(--blue)}
.g.sug{box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--ink)}
.known-l{display:block;margin:4px auto 0;text-align:center}
.done{text-align:center;padding:30px 0;display:grid;gap:14px}
.done h2{font-size:26px;margin:0}
.done-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.done-stats div{background:var(--sunk);border-radius:16px;padding:14px 6px;display:grid}
.done-stats b{font-size:30px;font-variant-numeric:tabular-nums;line-height:1.2}
.done-stats span{font-size:14px;color:var(--ink2)}
/* library */
.search{display:flex;gap:8px;padding-top:14px}
.search input{flex:1;height:46px;border:0;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:12px;background:var(--sunk);padding:0 14px;font-size:16px}
.search input:focus,textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--ink)}
.search select{height:46px;border:0;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:12px;background:var(--raise);padding:0 10px;font-size:15px;max-width:42%}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .chip{flex:none}
.libcount{display:flex;justify-content:space-between;align-items:center;margin:4px 0 0;font-size:14px;color:var(--ink2)}
.grp{display:flex;justify-content:space-between;font:600 14px var(--sans);color:var(--ink2);margin:16px 0 0;padding-bottom:6px;border-bottom:1px solid var(--line)}
.empty{padding:44px 0;text-align:center;color:var(--ink2)}
/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;margin:0 auto;max-width:680px;max-height:92%;display:flex;flex-direction:column;background:var(--raise);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.in{transform:none}
.sh-in{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 20px calc(28px + env(safe-area-inset-bottom))}
.sh-bar{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--raise);padding:8px 0 4px;min-height:56px}
.sh-bar h2{margin:0}
.d-w{font:700 clamp(32px,9vw,46px)/1.12 var(--serif);margin:0 0 4px;overflow-wrap:anywhere}
textarea{width:100%;border:0;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:12px;background:var(--sunk);padding:10px 12px;font-size:16px;resize:vertical;color:var(--ink)}
.mem{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.mem div{background:var(--sunk);border-radius:12px;padding:8px 10px}
.mem dt{font-size:13px;color:var(--ink2)}
.mem dd{margin:0;font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set>span{font-size:16px}
.set .seg{max-width:230px;flex:none;width:230px}
.mlc{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));z-index:40;transform:translate(-50%,-14px);box-shadow:0 8px 24px rgba(0,0,0,.22);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:15px;line-height:1.45;width:max-content;max-width:min(92vw,520px);text-align:center;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:380px){.cap .add{padding:0 14px}.g b{font-size:15px}.mem{grid-template-columns:repeat(2,minmax(0,1fr))}.set .seg{width:190px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function voiceFor(lang){
  const want=lang.toLowerCase(),m=voices.filter(v=>str(v.lang).toLowerCase().replace('_','-')===want);
  const pref=want==='en-gb'?['Daniel','Serena','Kate','Arthur','Martha','Google UK']:['Samantha','Ava','Allison','Alex','Nicky','Google US'];

}
function tts(text,acc,slow){
  if(!synth){toast(t('noTTS'));return}
  try{
    const lang=acc==='uk'?'en-GB':'en-US',u=new SpeechSynthesisUtterance(text),v=voiceFor(lang);
    u.lang=lang;if(v)u.voice=v;u.rate=slow?0.6:(Number(S.rate)||0.9);curU=u;
    if(synth.speaking||synth.pending){synth.cancel();setTimeout(()=>{try{synth.speak(u)}catch(e){}},80)}else synth.speak(u);
  }catch(e){}
}
const player=new Audio();player.preload='none';
function say(text,o={}){
  text=str(text).trim();if(!text)return;
  const acc=o.accent||S.accent;
  try{if(synth&&(synth.speaking||synth.pending))synth.cancel()}catch(e){}
  if(EMBED||S.voice==='tts'||o.slow||navigator.onLine===false||!/^[\x20-\x7e’‘]+$/.test(text)){tts(text,acc,o.slow);return}
  let fell=false;const fb=()=>{if(fell)return;fell=true;tts(text,acc,o.slow)};
  try{player.pause()}catch(e){}
  player.onerror=fb;
  player.src='https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(text)+'&type='+(acc==='uk'?1:2);
  try{const p=player.play();if(p&&p.catch)p.catch(e=>{if(!e||e.name!=='AbortError')fb()})}catch(e){fb()}
}

/* ---------- offline dictionary (ECDICT + LEXiTRON) ---------- */
const chunkP=new Map();
function chunkName(k){
  const a=k[0]||'',b=k[1]||'',c=k[2]||'',L=/^[a-z]$/;
  if(!L.test(a))return DIX.__;
  const p2=a+(L.test(b)?b:'_');
  return DIX[p2+(L.test(c)?c:'_')]||DIX[p2];
}
function loadChunk(name){
  if(!name)return Promise.resolve({});
  let p=chunkP.get(name);
  if(!p){p=fetch('dict/'+name+'.json').then(r=>{if(!r.ok)throw new Error('http '+r.status);return r.json()});chunkP.set(name,p);p.catch(()=>chunkP.delete(name))}
  return p;
}
async function rawGet(k){const c=await loadChunk(chunkName(k));return Object.prototype.hasOwnProperty.call(c,k)?c[k]:undefined}
function info(key,e){return{key,hw:str(e[0]||key),ph:str(e[1]),tr:str(e[2]),rank:Number(e[3])||0,tags:str(e[4]),ex:str(e[5]),col:Number(e[6])||0,ox:Number(e[7])||0,roots:A(e[8]),sg:Number.isInteger(e[9])?e[9]:-1,th:str(e[10]),en:str(e[11])}}
async function find(q,depth=0){
  const k=norm(q);if(!k||depth>2)return null;
  const e=await rawGet(k);
  if(typeof e==='string'&&e[0]==='='){const[lem,kind]=e.slice(1).split('|'),lk=norm(lem),le=await rawGet(lk);return Array.isArray(le)?{inf:info(lk,le),form:k,kind:str(kind)}:null}
  if(Array.isArray(e))return{inf:info(k,e)};
  for(const a of[k.replace(/-/g,' '),k.replace(/ /g,'-'),k.replace(/-/g,''),k.replace(/[^a-z' -]/g,'')])if(a&&a!==k){const r=await find(a,depth+1);if(r)return r}
  return null;
}
function osa(a,b,max){
  const n=a.length,m=b.length;if(Math.abs(n-m)>max)return max+1;
  let pp=null,p=Array.from({length:m+1},(_,j)=>j);
  for(let i=1;i<=n;i++){const c=[i];let best=i;
    for(let j=1;j<=m;j++){let v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));
      if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])v=Math.min(v,pp[j-2]+1);c.push(v);if(v<best)best=v}
    if(best>max)return max+1;pp=p;p=c}
  return p[m];
}
async function suggest(q){
  const k=norm(q);if(k.length<3)return[];
  const max=k.length<=5?1:2,names=new Set([chunkName(k),chunkName(k[0]+k.slice(2)),chunkName(k[1]+k[0]+k.slice(2))]),cands=[];
  for(const n of names){let c;try{c=await loadChunk(n)}catch(e){continue}
    for(const key in c){if(Math.abs(key.length-k.length)>max||(key.includes(' ')!==k.includes(' ')))continue;
      const d=osa(k,key,max);if(d>max)continue;const e=c[key];
      cands.push([d,typeof e==='string'?9e5:(e[3]||5e5),typeof e==='string'?norm(e.slice(1).split('|')[0]):key])}}
  cands.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const out=[];for(const c of cands){if(!out.includes(c[2]))out.push(c[2]);if(out.length>=6)break}
  const res=[];for(const w of out){const f=await find(w);if(f&&!res.some(r=>r.inf.key===f.inf.key))res.push(f)}
  return res;
}
// Chinese / Thai -> English
const xIdx={};
function loadX(l){
  if(!xIdx[l]){xIdx[l]=fetch('dict/'+l+'.txt').then(r=>{if(!r.ok)throw 0;return r.text()}).then(tx=>{const m=new Map();for(const ln of tx.split('\n')){const i=ln.indexOf('\t');if(i>0)m.set(ln.slice(0,i),ln.slice(i+1).split(','))}return m});xIdx[l].catch(()=>{delete xIdx[l]})}
  return xIdx[l];
}
async function xFind(q,l,max){
  const m=await loadX(l),sc=new Map(),add=(w,s,term)=>{const c=sc.get(w);if(!c||c.s>s)sc.set(w,{s,term})};
  (m.get(q)||[]).forEach((w,i)=>add(w,i,q));
  if(sc.size<max)for(const[tm,ws]of m)if(tm!==q&&tm.startsWith(q))ws.slice(0,3).forEach((w,i)=>add(w,60+tm.length*3+i,tm));
  if(sc.size<max)for(const[tm,ws]of m)if(!tm.startsWith(q)&&tm.includes(q))ws.slice(0,3).forEach((w,i)=>add(w,200+tm.length*3+i,tm));
  if(sc.size<6&&q.length>=3)for(const[tm,ws]of m)if(tm.length>=2&&q.includes(tm))ws.slice(0,4).forEach((w,i)=>add(w,500-tm.length*8+i,tm));
  return[...sc.entries()].sort((a,b)=>a[1].s-b[1].s).slice(0,max).map(([w,v])=>({x:true,w,term:v.term}));
}

const webBusy=new Set(),webQ=[];let webOff=false;

async function enrich(id){
  const c=words[id];if(EMBED||webOff||!c||c.st!=='ok'||webBusy.has(id)||navigator.onLine===false)return;
  if(c.w&&Date.now()-c.w.at<120*DAY)return;
  webBusy.add(id);if(openId===id)renderDetail();
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),8000);
  try{
    const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(c.key),{signal:ctl.signal});
    if(!r.ok&&r.status!==404)throw 0;
    const w={us:'',uk:'',at:Date.now(),defs:[]},j=r.ok?await r.json():[];
    for(const en of A(j)){
      for(const p of A(en&&en.phonetics)){const a=str(p&&p.audio),tx=str(p&&p.text);if(!tx)continue;if(/-us\.mp3$/.test(a)&&!w.us)w.us=tx;else if(/-uk\.mp3$/.test(a)&&!w.uk)w.uk=tx}
      for(const mm of A(en&&en.meanings))for(const d of A(mm&&mm.definitions).slice(0,2))if(w.defs.length<6&&d&&d.definition)w.defs.push({pos:str(mm.partOfSpeech),en:str(d.definition),ex:str(d.example)})
    }
    const cur=words[id];if(cur){const n=clone(cur);n.w=w;put(fix(n,id))}
  }catch(e){if(e&&e.name==='TypeError'&&navigator.onLine!==false)webOff=true}finally{clearTimeout(tm);webBusy.delete(id);if(openId===id)renderDetail()}
}

async function addFrom(raw,note){

  const parts=raw.split(/[,，;；、\n]+/).map(s=>s.trim()).filter(Boolean).slice(0,20),rs=[],miss=[];
  for(const p of parts){

let acRows=[],acSeq=0;

/* ---------- dates + spaced repetition ---------- */
const dkey=x=>{const d=new Date(x);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()};
function dayStart(x=Date.now()){const d=new Date(x);if(d.getHours()<4)d.setDate(d.getDate()-1);d.setHours(4,0,0,0);return d.getTime()}
function dueIn(n){const d=new Date(dayStart());d.setDate(d.getDate()+n);return d.getTime()}
const fmtIv=d=>d<=1?t('ivDay',1):d<60?t('ivDay',d):d<365?t('ivMon',Math.round(d/30)):t('ivYear');
const fmt=(x,o)=>{try{return new Intl.DateTimeFormat(LOC(),o).format(new Date(x))}catch(e){return new Date(x).toLocaleDateString()}};
function dayLabel(x){const a=new Date();a.setHours(0,0,0,0);const b=new Date(x);b.setHours(0,0,0,0);const n=Math.round((a-b)/DAY);
  if(n===0)return t('today');if(n===1)return t('yesterday');if(n===2)return t('dayBefore');
  return fmt(b,{month:'short',day:'numeric',weekday:'short',...(b.getFullYear()!==a.getFullYear()?{year:'numeric'}:{})})}
function relDue(x){const now=Date.now();if(x<=now)return t('now');if(x-now<60*MIN)return t('inMin',Math.ceil((x-now)/MIN));
  const n=Math.round((dayStart(x)-dayStart(now))/DAY);if(n<=0)return t('laterToday');if(n===1)return t('tomorrow');if(n===2)return t('in2');if(n<30)return t('inDays',n);
  return fmt(x,{month:'short',day:'numeric'})}
const fmtDate=x=>fmt(x,{year:'numeric',month:'short',day:'numeric'});
// grades: 0 forgot · 1 unsure · 2 got it · 3 easy (an SM-2 style schedule)
function sched(s0,g){
  const s={...s0,h:[...s0.h]},now=Date.now(),learn=s.state!=='review';let rq=0;
  if(g===0){if(!learn){s.lapses++;s.ef=Math.max(1.3,s.ef-0.2)}s.state='learning';s.iv=0;s.due=now+MIN;rq=3}
  else if(learn){if(g===1){s.state='learning';s.due=now+10*MIN;rq=7}else{s.state='review';s.iv=g===2?1:4;s.due=dueIn(s.iv);s.reps++}}
  else{const iv=Math.max(1,s.iv);
    if(g===1){s.iv=Math.max(1,Math.round(iv*1.2));s.ef=Math.max(1.3,s.ef-0.15)}
    else if(g===2)s.iv=Math.max(iv+1,Math.round(iv*s.ef));
    else{s.iv=Math.max(iv+2,Math.round(iv*s.ef*1.3));s.ef=Math.min(3,s.ef+0.15)}
    s.iv=Math.min(s.iv,365);s.due=dueIn(s.iv);s.reps++}
  s.last=now;s.h.push([now,g]);if(s.h.length>40)s.h=s.h.slice(-40);
  return{s,rq};
}
function ivLabel(s,g){const r=sched(s,g).s;return r.state!=='review'?(g===0?t('ivMin1'):t('ivMin10')):fmtIv(r.iv)}
function activity(){const m=new Map(),inc=k=>m.set(k,(m.get(k)||0)+1);for(const c of Object.values(words)){inc(dkey(c.created));for(const h of c.srs.h)inc(dkey(h[0]))}return m}
function stats(){
  const all=Object.values(words),now=Date.now(),today=dkey(now),act=activity(),lv=[0,0,0,0,0],fc=[0,0,0,0,0,0,0],b=[];
  for(let i=0;i<=7;i++)b.push(dueIn(i));
  let due=0,revToday=0,addToday=0,bookToday=0;
  for(const c of all){
    if(dkey(c.created)===today){addToday++;if(c.src==='book')bookToday++}
    if(c.srs.h.some(h=>dkey(h[0])===today))revToday++;
    if(isKnown(c)){lv[4]++;continue}
    if(!canReview(c))continue;
    lv[level(c)]++;if(c.srs.due<=now)due++;
    const x=c.srs.due;if(x<b[1])fc[0]++;else for(let i=1;i<7;i++)if(x<b[i+1]){fc[i]++;break}
  }
  let streak=0;const d=new Date();if(!act.has(dkey(d)))d.setDate(d.getDate()-1);
  while(act.has(dkey(d))){streak++;d.setDate(d.getDate()-1)}
  return{all,due,lv,fc,streak,revToday,addToday,bookToday,act,ok:lv[0]+lv[1]+lv[2]+lv[3],tot:lv.reduce((a,b)=>a+b,0)};
}

<div class="set"><span>${t('accent')}</span>${seg('accent',[['us',t('aUS')],['uk',t('aUK')]])}</div>
${EMBED?'':`<div class="set"><span>${t('voice')}</span>${seg('voice',[['real',t('vReal')],['tts',t('vTTS')]])}</div>`}
<div class="set"><span>${t('autoRead')}</span>${seg('auto',[['true',t('on')],['false',t('off')]])}</div>
<div class="set"><span>${t('limit')}</span>${seg('limit',[['20','20'],['30','30'],['50','50'],['100','100']])}</div>
<p class="fine">${EMBED?t('voiceNoteEmbed'):t('voiceNote')}${t('silent')}</p>
<button class="btn ghost" data-act="say-t" data-t="pronunciation">${t('test')}</button>
<h3>${t('offT')}</h3>
${EMBED?`<p class="fine">${t('offEmbed')}</p>`:swOK()?`<p class="fine">${S.offline?t('offDone'):t('offInfo')}</p><button class="btn ghost" data-act="dl"${dlBusy?' disabled':''}>${dlBusy?esc(dlText):S.offline?t('redl'):t('dl')}</button>`:`<p class="fine">${t('offLater')}</p>`}
<h3>${t('bkT')}</h3>
<p class="fine">${t('bkInfo',EMBED?t('whereB'):t('whereA'))}</p>
<div class="acts" style="margin-top:8px">${EMBED?'':`<button class="btn ghost" data-act="export">${t('export')}</button>`}<button class="btn ghost" data-act="copy-bk">${t('copyBk')}</button><button class="btn ghost" data-act="import">${t('import')}</button></div>
<textarea id="bk" rows="5" hidden aria-label="${esc(t('bkT'))}" placeholder="${esc(t('bkPh'))}"></textarea>
<button class="btn ink" data-act="import-text" id="bkgo" hidden>${t('importPaste')}</button>
<h3>${t('rulesT')}</h3><p class="fine">${t('rules')}</p>
<h3>${t('aboutT')}</h3><p class="fine">${t('about')}</p>`;
}
function render(){
  const st=stats(),bd=$('#badge');
  bd.textContent=st.due>99?'99+':String(st.due);bd.hidden=!st.due;
  if(tab==='home')renderHome(st);else if(tab==='lib')renderLib();else if(!R&&!doneShown)renderIntro(st);
  if(sheetKind==='word')renderDetail();
}
function go(v){
  if(v!==tab)doneShown=false;
  tab=v;
  document.querySelectorAll('.tabs [data-act=tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===v)));
  for(const x of['home','review','lib'])$('#v-'+x).hidden=x!==v;
  render();window.scrollTo(0,0);
}
function showSheet(){clearTimeout(hideT);$('#scrim').hidden=false;const s=$('#sheet');s.hidden=false;void s.offsetHeight;s.classList.add('in');document.documentElement.classList.add('lock');$('#shIn').scrollTop=0}
function closeSheet(){
  const ta=$('#dn');if(ta&&sheetKind==='word')saveNote(ta);
  sheetKind=null;openId=null;armed='';$('#scrim').hidden=true;
  const s=$('#sheet');s.classList.remove('in');hideT=setTimeout(()=>{if(!sheetKind)s.hidden=true},280);
  document.documentElement.classList.remove('lock');
}
function openWord(id){if(!words[id])return;sheetKind='word';openId=id;armed='';renderDetail(true);showSheet();enrich(id)}
function openSettings(){sheetKind='set';openId=null;renderSettings();showSheet()}
function openBooks(){sheetKind='books';openId=null;renderBooks();showSheet()}
function saveNote(ta){const c=words[openId];if(!c)return;const v=ta.value.trim().slice(0,1000);if(v!==c.note){const n=clone(c);n.note=v;put(fix(n,c.id));toast(t('noteSaved'));setTimeout(render,0)}}
function relang(l){setLang(l);save();render();if(R)showCard(false);if(sheetKind==='set')renderSettings();else if(sheetKind==='word')renderDetail(true);else if(sheetKind==='books')renderBooks();if(acRows.length)renderAC();renderPick()}

/* ---------- backup + offline download ---------- */
const backupText=()=>JSON.stringify({app:'shengciben',v:2,at:new Date().toISOString(),S,words:Object.values(words)});
function showBk(x,msg){if(sheetKind!=='set')openSettings();const ta=$('#bk');ta.hidden=false;$('#bkgo').hidden=!!x;ta.readOnly=!!x;ta.value=x||'';ta.focus();if(x)ta.select();if(msg)toast(msg)}
function exportFile(){
  if(!Object.keys(words).length){toast(t('bkEmpty'));return}
  const x=backupText(),name='wordbook-backup-'+ymd()+'.json';
  try{const file=new File([x],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:t('appName')}).catch(e=>{if(!e||e.name!=='AbortError')saveBlob(x,name)});return}}catch(e){}
  saveBlob(x,name);
}
function saveBlob(x,name){
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);toast(t('bkFile'))}
  catch(e){showBk(x,t('bkShow'))}
}
function copyText(x,okMsg){try{navigator.clipboard.writeText(x).then(()=>toast(okMsg),()=>showBk(x,t('copyShow')))}catch(e){showBk(x,t('copyShow'))}}
function importText(x){
  let o;try{o=JSON.parse(x)}catch(e){toast(t('bkBad'));return}
  const list=Array.isArray(o)?o:A(o&&o.words);let n=0,u=0;
  for(const raw of list){if(!raw||typeof raw!=='object'||!raw.id)continue;const c=fix(clone(raw),raw.id),cur=words[c.id];
    if(!cur){if(byKey(c.key))continue;words[c.id]=c;n++}else if(c.updated>cur.updated){words[c.id]=c;u++}}
  save();render();toast(t('bkDone',n,u));if(Object.values(words).some(c=>c.d&&c.d.v<2))upgradeOld();
}
async function downloadAll(){
  if(dlBusy)return;dlBusy=true;
  const files=[...new Set(Object.values(DIX))].map(n=>'dict/'+n+'.json').concat(['dict/zh.txt','dict/th.txt','dict/books.json'],Array.from({length:NS},(_,i)=>'dict/sim'+i+'.json'));
  const total=files.length,q=files.slice();let done=0,fail=0;
  const upd=()=>{dlText=t('dling',done,total);const b=$('[data-act=dl]');if(b)b.textContent=dlText};
  upd();
  const worker=async()=>{while(q.length){const f=q.shift();try{const r=await fetch(f);if(!r.ok)throw 0;await r.arrayBuffer()}catch(e){fail++}done++;upd()}};
  await Promise.all([worker(),worker(),worker(),worker()]);
  dlBusy=false;
  if(!fail){S.offline=Date.now();save();toast(t('dlOk'))}else toast(t('dlFail',fail));
  if(sheetKind==='set')renderSettings();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case'tab':go(b.dataset.v);break;
    case'gear':openSettings();break;
    case'lang-cycle':relang(LANGS[(LANGS.indexOf(S.lang)+1)%3]);break;
    case'close':closeSheet();break;
    case'start':start(false);break;
    case'practice':start(true);break;
    case'redo':start(true,lastForgot);break;
    case'learn':learnNew(b);break;
    case'books':openBooks();break;
    case'book':S.book=b.dataset.v;save();closeSheet();render();break;
    case'daily':S.daily=Number(b.dataset.v);save();render();break;
    case'end':if(R&&R.n)finish();else{R=null;renderIntro()}break;
    case'reveal':reveal();break;
    case'opt':pickOpt(+b.dataset.i);break;
    case'grade':grade(+b.dataset.g);break;
    case'known-r':{if(!R||!R.shown)break;const id2=R.q[R.i];setKnown(id2,true);R.q=R.q.filter((x,k)=>k<=R.i||x!==id2);if(!(id2 in R.first)){R.first[id2]=3;R.n++;R.ok++}toast(t('knownToast'));R.i++;render();showCard(true);break}
    case'known-d':{const c=words[openId];if(!c)break;const on=!isKnown(c);setKnown(openId,on);toast(on?t('knownToast'):t('unknownDone'));renderDetail(true);render();break}
    case'mode':S.mode=b.dataset.v;save();renderIntro();break;
    case'say':{const c=words[id];if(c)say(W2(c),{accent:b.dataset.acc});break}
    case'slow':{const c=words[id];if(c)say(W2(c),{slow:true});break}
    case'say-card':{const c=R&&words[R.q[R.i]];if(c)say(W2(c));break}
    case'say-t':say(b.dataset.t,{accent:b.dataset.acc});break;
    case'hint':{const c=R&&words[R.q[R.i]];if(!c)break;const w=W2(c);
      $('#spres').innerHTML=`<span class="hintw">${esc(w.split(' ').map(p=>p[0]+' _'.repeat(Math.max(0,p.length-1))).join('   '))}</span>　<span class="fine">${t('letters',w.replace(/\s/g,'').length)}</span>`;break}
    case'open':openWord(id);break;
    case'ac-add':{const f=acRows[+b.dataset.i];if(!f)break;const note=$('#nt').value.trim().slice(0,300),typed=$('#w').value.trim();
      clearTimeout(acT);acSeq++;$('#w').value='';$('#nt').value='';acRows=[];renderAC();pick=null;
      if(f.x)addX(f.w,note,typed);else{addedToast([addFound(f,note,f.form||f.inf.hw)]);render()}break}
    case'pick-add':{const f=pick&&pick.items&&pick.items[+b.dataset.i];if(!f)break;
      if(f.x)addX(f.w,pick.note,pick.q);else{addedToast([addFound(f,pick.note,pick.q)]);pick=null;render()}break}
    case'pick-x':pick=null;renderPick();break;
    case'save-raw':{if(!pick)break;const r=addRaw(pick.q,pick.note,'nf');addedToast([r]);pick=null;render();if(!r.dup)openWord(r.c.id);break}
    case'retry':retryPending();break;
    case'tip-x':S.tip=false;save();render();break;
    case'reset':{if(armed==='rs'+openId&&Date.now()-armT<5000){const c=clone(words[openId]);c.srs=fix({}).srs;put(fix(c,openId));armed='';toast(t('resetDone'));renderDetail(true);render()}
      else{armed='rs'+openId;armT=Date.now();renderDetail(true)}break}
    case'del':{if(armed==='del'+openId&&Date.now()-armT<5000){const i=openId;closeSheet();drop(i);toast(t('deleted'));render()}
      else{armed='del'+openId;armT=Date.now();renderDetail(true)}break}
    case'set':{const k=b.dataset.k,v=b.dataset.v;
      if(k==='lang'){relang(v);break}
      S[k]=k==='auto'?v==='true':k==='limit'?Number(v):v;save();renderSettings();if(k==='accent'||k==='voice')say('pronunciation');render();break}
    case'ml':{let m=ML().slice();const l=b.dataset.v;if(m.includes(l)){if(m.length>1)m=m.filter(x=>x!==l)}else m.push(l);S.ml=m;save();renderSettings();render();if(R)showCard(false);break}
    case'flt':flt=b.dataset.v;libMax=200;renderLib();break;
    case'more':libMax+=200;renderLib();break;
    case'copy':{const list=Object.values(words).sort((x,y)=>x.created-y.created);if(!list.length){toast(t('bkEmpty'));break}
      copyText(list.map(c=>[W2(c),ipa(c.d&&c.d.ph),gloss(c),c.note].join('\t')).join('\n'),t('listCopied',list.length));break}
    case'export':exportFile();break;
    case'copy-bk':if(!Object.keys(words).length){toast(t('bkEmpty'));break}copyText(backupText(),t('bkCopied',Object.keys(words).length));break;
    case'import':{const f=$('#imf');f.value='';f.click();setTimeout(()=>{if(sheetKind==='set'){const ta=$('#bk');if(ta&&ta.hidden){ta.hidden=false;ta.readOnly=false;ta.value='';$('#bkgo').hidden=false}}},400);break}
    case'import-text':{const v=$('#bk').value.trim();if(v)importText(v);break}
    case'dl':downloadAll();break;
  }
});
$('#imf').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;f.text().then(importText,()=>toast(t('readFail')))});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&sheetKind){closeSheet();return}
  if(tab!=='review'||!R||sheetKind)return;
  const x=e.target;
  if(x&&x.id==='sp'){if(e.key==='Enter'){e.preventDefault();reveal()}return}
  if(x&&/^(INPUT|TEXTAREA|SELECT)$/.test(x.tagName))return;
  if(R.cm==='choice'&&!R.shown&&/^[1-4]$/.test(e.key)){e.preventDefault();pickOpt(+e.key-1);return}
  if((e.key===' '||e.key==='Enter')&&!R.shown){e.preventDefault();reveal()}
  else if(R.shown&&/^[1-4]$/.test(e.key)){e.preventDefault();grade(+e.key-1)}
});
document.addEventListener('change',e=>{if(e.target.id==='dn')saveNote(e.target)});
$('#cap').addEventListener('submit',e=>{e.preventDefault();const w=$('#w'),n=$('#nt'),v=w.value;if(!v.trim()){w.focus();return}
  clearTimeout(acT);acSeq++;acRows=[];renderAC();addFrom(v,n.value.trim().slice(0,300));w.value='';n.value=''});
let acT=0;$('#w').addEventListener('input',e=>{clearTimeout(acT);const v=e.target.value;acT=setTimeout(()=>autocomplete(v),140)});
$('#q').addEventListener('input',()=>{libMax=200;renderLib()});
$('#sort').addEventListener('change',()=>renderLib());
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
window.addEventListener('online',()=>retryPending());
setInterval(()=>{if(!document.hidden)render()},60000);

/* ---------- start ---------- */
load();
if(!S.lang)S.lang=str(navigator.language).toLowerCase().startsWith('th')?'th':'zh';
setLang(S.lang);render();
if(Object.values(words).some(c=>c.st==='pd'))setTimeout(retryPending,800);
if(Object.values(words).some(c=>c.d&&c.d.v<2))setTimeout(upgradeOld,1200);
if(!EMBED&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
